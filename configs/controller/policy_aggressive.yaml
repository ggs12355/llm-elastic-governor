namespace: llm-serving
deployment: vllm-qwen
mode: dry-run
min_replicas: 1
max_replicas: 6
scale_step: 1
window_seconds: 30
cooldown_seconds: 60
scale_in_cooldown_seconds: 180
hysteresis_windows: 1
loop_interval_seconds: 10
thresholds:
  queue_time_p99_high: 1.2
  ttft_p99_high: 2.0
  tpot_p99_high: 0.18
  e2e_latency_p99_high: 12.0
  waiting_requests_high: 4
  gpu_memory_ratio_high: 0.86
  gpu_memory_ratio_critical: 0.94
  gpu_utilization_low: 0.40
  gpu_utilization_high: 0.80
  error_rate_high: 0.02
  timeout_rate_high: 0.01
  long_context_ratio_high: 0.20
  tenant_overload_ratio_high: 0.25

