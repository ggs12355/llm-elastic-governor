namespace: llm-serving
deployment: vllm-qwen
mode: dry-run
min_replicas: 1
max_replicas: 4
scale_step: 1
window_seconds: 60
cooldown_seconds: 120
scale_in_cooldown_seconds: 300
hysteresis_windows: 2
loop_interval_seconds: 15
thresholds:
  queue_time_p99_high: 2.0
  ttft_p99_high: 3.0
  tpot_p99_high: 0.25
  e2e_latency_p99_high: 20.0
  waiting_requests_high: 8
  gpu_memory_ratio_high: 0.90
  gpu_memory_ratio_critical: 0.96
  gpu_utilization_low: 0.35
  gpu_utilization_high: 0.85
  error_rate_high: 0.03
  timeout_rate_high: 0.02
  long_context_ratio_high: 0.25
  tenant_overload_ratio_high: 0.30

