name: streaming-slow-client
duration_seconds: 90
concurrency: 16
request_rate: 1.5
timeout_seconds: 240
seed: 47
tenants: [tenant-a, tenant-b]
prompt_templates:
  - "Request {index} from {tenant_id}: generate a structured incident analysis for LLM serving."
