name: token-shift
duration_seconds: 120
concurrency: 24
request_rate: 2.0
timeout_seconds: 240
seed: 46
tenants: [tenant-a, tenant-b]
prompt_templates:
  - "Request {index} from {tenant_id}: write a detailed answer about LLM serving parameters."
output_tokens: [64, 256, 1024]
long_prompt_tokens: 2048
long_context_ratio: 0.25
burst_after_seconds:
burst_rate_multiplier: 1.0
streaming: true

