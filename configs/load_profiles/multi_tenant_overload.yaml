name: multi-tenant-overload
duration_seconds: 120
concurrency: 32
request_rate: 3.0
timeout_seconds: 240
seed: 45
tenants: [tenant-a, tenant-b, tenant-c, tenant-low]
prompt_templates:
  - "Request {index} from {tenant_id}: draft a technical answer about GPU resource governance."
output_tokens: [128, 256, 512]
long_prompt_tokens: 2048
long_context_ratio: 0.20
burst_after_seconds: 45
burst_rate_multiplier: 3.0
streaming: true

