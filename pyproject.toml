[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-elastic-governor"
version = "0.1.0"
description = "Learning repository for SLO-aware elastic scheduling and GPU resource governance for vLLM serving on Kubernetes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "kubernetes>=29.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
llm-loadgen = "loadgen.runner:main"
llm-analyze = "loadgen.analyze:main"
llm-controller = "controller.main:main"
llm-gpu-collector = "metrics.gpu_collector:main"
llm-mock-metrics = "metrics.mock_server:main"
llm-sim-replicas = "simulator.multi_replica:main"
llm-sim-prefix-cache = "simulator.prefix_cache:main"
llm-sim-topology = "simulator.topology_scheduler:main"
llm-sim-queue = "simulator.queue_scheduler:main"
llm-sim-tenant-quota = "simulator.tenant_quota:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

