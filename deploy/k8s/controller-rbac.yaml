apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-elastic-controller
  namespace: llm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-elastic-controller
  namespace: llm-serving
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-elastic-controller
  namespace: llm-serving
subjects:
  - kind: ServiceAccount
    name: llm-elastic-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-elastic-controller

